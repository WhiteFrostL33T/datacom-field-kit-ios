<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Kit">
<meta name="theme-color" content="#0b3d6e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Datacom Field Kit</title>
<style>
:root{
  --bg:#0c141f; --panel:#14212f; --panel2:#1a2a3c; --line:#26394f;
  --text:#e8eef4; --muted:#93a6b8; --accent:#3b8bff; --brand:#0b3d6e;
  --green:#35b36b; --amber:#e8a33d; --red:#e5534b; --chip:#1f3247;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px;}
button,input,select,textarea{font:inherit;color:var(--text);}
input,select,textarea{background:#0a1119;border:1px solid var(--line);border-radius:10px;
  padding:12px;width:100%;margin:4px 0 10px;min-width:0;}
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;
  min-width:0;max-width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent);}
label{font-size:.82rem;color:var(--muted);display:block;margin-top:6px;}
textarea{min-height:90px;resize:vertical;}
header{position:sticky;top:0;z-index:20;background:var(--brand);padding:12px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.4);}
header .ttl{font-size:1.15rem;font-weight:700;flex:1;letter-spacing:.2px;}
header .ttl small{display:block;font-size:.72rem;font-weight:400;color:#bcd2e8;}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:10px;padding:9px 13px;font-size:.9rem;cursor:pointer;min-height:44px;}
main{padding:14px 12px 90px;max-width:860px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:0 0 12px;}
.card h3{margin:0 0 6px;font-size:1.05rem;}
.card h4{margin:14px 0 6px;font-size:.95rem;color:#cfe0f0;}
.mut{color:var(--muted);font-size:.86rem;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row>*{flex:1;min-width:0;}
.row .fx0{flex:0 0 auto;}
.btn{background:var(--accent);border:none;border-radius:10px;padding:12px 16px;
  font-weight:600;cursor:pointer;min-height:48px;width:100%;}
.btn.sec{background:var(--chip);font-weight:500;}
.btn.grn{background:var(--green);}
.btn.red{background:var(--red);}
.btn.sml{padding:8px 12px;min-height:40px;width:auto;font-size:.9rem;}
button:disabled{opacity:.45;}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:.76rem;margin:2px 3px 2px 0;color:#c9d9e8;}
.chip.on{background:#174a7c;color:#dceeff;border-color:#2c5f92;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;}
.tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:10px 16px;cursor:pointer;font-size:.92rem;min-height:44px;}
.tab.act{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:.92rem;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);}
.kv:last-child{border-bottom:none;}
.kv b{font-weight:600;}
.bar{height:14px;background:#0a1119;border-radius:7px;overflow:hidden;border:1px solid var(--line);}
.bar>i{display:block;height:100%;background:var(--green);}
.bar>i.warn{background:var(--amber);} .bar>i.over{background:var(--red);}
.err{background:#3a1d1b;border:1px solid var(--red);color:#ffb4ae;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;}
.ok{background:#173325;border:1px solid var(--green);color:#a9e8c3;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;}
.switch{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
.switch:last-child{border-bottom:none;}
.tgl{position:relative;width:56px;height:32px;flex:0 0 auto;}
.tgl input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2;}
.tgl i{position:absolute;inset:0;background:#33465c;border-radius:999px;transition:.15s;}
.tgl i:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;}
.tgl input:checked + i{background:var(--green);}
.tgl input:checked + i:after{left:27px;}
#timerbar{background:#3d2c07;border-bottom:2px solid var(--amber);color:#ffe1a8;
  padding:10px 14px;display:none;font-size:.95rem;}
#timerbar.show{display:flex;align-items:center;gap:10px;}
#timerbar .el{font-weight:700;font-variant-numeric:tabular-nums;}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#222f3f;
  border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:999px;
  font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:92vw;text-align:center;}
.appfoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--brand);
color:#bcd2e8;text-align:center;font-size:.68rem;padding:8px 10px;letter-spacing:.3px;}
#toast.show{opacity:1;}
.big{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;}
.proj-head{display:flex;align-items:flex-start;gap:10px;}
.proj-head .grow{flex:1;min-width:0;}
.del{color:var(--red);background:none;border:none;cursor:pointer;font-size:.9rem;padding:8px;min-height:40px;}
.edt{color:var(--accent);background:none;border:none;cursor:pointer;font-size:.9rem;padding:8px;min-height:40px;}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;}
.seg button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:10px;
  padding:11px 6px;cursor:pointer;min-height:48px;font-size:.9rem;}
.seg button.act{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
.preset{flex:0 0 auto !important;min-width:0;}
</style>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
</head>
<body>
<header>
  <div class="ttl" style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="width:38px;height:38px;border-radius:9px;flex:0 0 auto"><div>Datacom Field Kit<small id="hdrsub">Projects</small></div></div>
  <button class="hbtn" id="btnHome">Projects</button>
  <button class="hbtn" id="btnBackup">Backup</button>
</header>
<div id="timerbar"></div>
<main id="app"></main>
<div id="toast"></div>
<footer class="appfoot" id="appfoot">&copy; 2026 Jeremy Ashley &middot; Field Kit Web</footer>

<script>
"use strict";
/* ============ pure math (exposed for tests) ============ */
function ipToInt(ip){var p=String(ip).trim().split('.');if(p.length!==4)return null;
  var n=0;for(var i=0;i<4;i++){var o=Number(p[i]);if(!isFinite(o)||o<0||o>255||p[i]=='')return null;n=((n<<8)|o)>>>0;}return n;}
function intToIp(n){return [((n>>>24)&255),((n>>>16)&255),((n>>>8)&255),(n&255)].join('.');}
window.FK={
  cableUsed:function(a,b,boxSize){boxSize=(boxSize==null||boxSize===''||!isFinite(boxSize))?1000:Number(boxSize);
    if(b===null||b===undefined||b==='')return boxSize-Number(a);return Number(a)-Number(b);},
  storageTB:function(cams,mbps,hours,days){return (Number(mbps)/8*3600*Number(hours)*Number(days)*Number(cams))/1e6;},
  storageDays:function(cams,mbps,hours,tb){var perDay=Number(mbps)/8*3600*Number(hours)*Number(cams);
    return perDay>0?(Number(tb)*1e6)/perDay:0;},
  subnetCalc:function(cidr){var parts=String(cidr).trim().split('/');
    if(parts.length!==2)throw new Error('Use CIDR form, e.g. 10.40.0.0/22');
    var ip=ipToInt(parts[0]);var pre=Number(parts[1]);
    if(ip===null)throw new Error('Bad IP address');
    if(!isFinite(pre)||pre<0||pre>32||String(parts[1]).trim()==='')throw new Error('Bad prefix length');
    var total=Math.pow(2,32-pre);
    var mask=pre===0?0:((0xFFFFFFFF<<(32-pre))>>>0);
    var net=(ip&mask)>>>0, bcast=(net|(0xFFFFFFFF^mask))>>>0;
    var first,last,usable;
    if(pre<=30){first=net+1;last=bcast-1;usable=total-2;}
    else if(pre===31){first=net;last=bcast;usable=2;}
    else{first=net;last=net;usable=1;}
    return {network:intToIp(net),broadcast:intToIp(bcast),netmask:intToIp(mask),
      wildcard:intToIp((0xFFFFFFFF^mask)>>>0),firstUsable:intToIp(first),lastUsable:intToIp(last),
      totalHosts:total,usableHosts:usable,prefix:pre};}
};
/* ============ data layer ============ */
var LS_KEY='fk_data_v1';
var APP_VERSION='2.8';
var MODULES=[['time','Time'],['cable','Cable'],['materials','Materials'],['finallog','Connectwise Notes'],
  ['storage','Storage'],['poe','PoE'],['subnet','Subnet / IP'],['ports','Ports']];
var ALWAYS_ON=['finallog'];
var DEFAULT_MODULES=['time','cable','materials'];
var KINDS=['Drive','On site','Remote','Shop'];
function allModuleKeys(){return MODULES.map(function(m){return m[0];});}
function defaultData(){return {projects:[],timeEntries:[],timer:null,pulls:[],
  storageCalcs:{},poeSwitches:[],poeDevices:[],ipAssignments:[],ipSubnets:{},
  portSwitches:[],portEntries:[],materials:[],matPicks:[]};}
var data;
try{data=JSON.parse(localStorage.getItem(LS_KEY))||defaultData();}catch(e){data=defaultData();}
(function(){var d=defaultData();for(var k in d){if(data[k]===undefined)data[k]=d[k];}})();
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){toast('Storage full / unavailable');}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function val(id){var e=$(id);return e?e.value.trim():'';}
function num(id){var v=parseFloat(val(id));return isFinite(v)?v:0;}
function toast(msg){var t=$('toast');t.textContent=msg;t.className='show';
  clearTimeout(t._h);t._h=setTimeout(function(){t.className='';},2600);}
function projById(id){return data.projects.filter(function(p){return p.id===id;})[0]||null;}
function enabledMods(p){var m=(p.enabledModules&&p.enabledModules.length)?p.enabledModules.slice():allModuleKeys();
  ALWAYS_ON.forEach(function(k){if(m.indexOf(k)<0)m.push(k);});return m;}
function fmtH(min){if(!isFinite(min))min=0;return (Math.round(min)/60).toFixed(2).replace(/\.?0+$/,'')+' h';}
function fmtHM(min){min=Math.round(min);var h=Math.floor(min/60),m=min%60;
  return h>0?(h+' h '+String(m).padStart(2,'0')+' m'):(m+' m');}
function entryMinutes(e){var a=new Date(e.startISO).getTime(),b=new Date(e.endISO).getTime();
  return (isFinite(a)&&isFinite(b)&&b>a)?(b-a)/60000:0;}
function projectMinutes(pid){return data.timeEntries.filter(function(e){return e.projectId===pid;})
  .reduce(function(s,e){return s+entryMinutes(e);},0);}
function projectCableFt(pid){return data.pulls.filter(function(x){return x.projectId===pid;})
  .reduce(function(s,x){return s+(Number(x.used)||0);},0);}
function toLocalInput(d){var p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function todayStr(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
/* ============ native bridge / fallbacks ============ */
function saveFile(name,text){
  if(window.Android&&window.Android.saveTextFile){window.Android.saveTextFile(name,text);return;}
  var type=/\.json$/i.test(name)?'application/json':'text/plain';
  var blob=new Blob([text],{type:type});var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);toast('Downloaded '+name);}
function copyText(text){
  if(window.Android&&window.Android.copyText){window.Android.copyText(text);return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Copied');},
      function(){fallbackCopy(text);});return;}
  fallbackCopy(text);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;
  ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copied');}catch(e){toast('Copy failed — long-press the text');}
  ta.remove();}
/* ============ routing ============ */
var view={name:'projects'};
var curTab='overview';
function goProjects(){view={name:'projects'};render();}
function goBackup(){view={name:'backup'};render();}
function openProject(id){view={name:'project',id:id};curTab='overview';render();}
function setTab(t){curTab=t;render();}
$('btnHome').addEventListener('click',goProjects);
$('btnBackup').addEventListener('click',goBackup);
function render(){
  $('hdrsub').textContent=view.name==='projects'?'Projects':
    view.name==='backup'?'Backup / Restore':
    (projById(view.id)?projById(view.id).name:'Project');
  renderTimerBar();
  if(view.name==='projects')renderProjects();
  else if(view.name==='backup')renderBackup();
  else renderProject();
}
/* ============ timer ============ */
var timerInt=null;
function renderTimerBar(){
  var bar=$('timerbar');
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(!data.timer){bar.className='';bar.innerHTML='';return;}
  var p=projById(data.timer.projectId);
  bar.className='show';
  function draw(){
    var el=Math.max(0,Math.floor((Date.now()-new Date(data.timer.startISO).getTime())/1000));
    var h=Math.floor(el/3600),m=Math.floor(el%3600/60),s=el%3600%60;
    var pad=function(n){return String(n).padStart(2,'0');};
    bar.innerHTML='<span>Timer running — <b>'+esc(data.timer.kind)+'</b> · '+
      esc(p?p.name:'(project deleted)')+'</span><span class="el">'+pad(h)+':'+pad(m)+':'+pad(s)+'</span>'+
      '<button class="hbtn" style="margin-left:auto" onclick="stopTimer()">Stop</button>';
  }
  draw();timerInt=setInterval(draw,1000);
}
function startTimer(pid,kind){
  if(data.timer){toast('A timer is already running — stop it first');return;}
  data.timer={projectId:pid,kind:kind,startISO:new Date().toISOString()};save();render();
  toast('Timer started ('+kind+')');}
function stopTimer(){
  if(!data.timer)return;
  var end=new Date();
  var start=new Date(data.timer.startISO);
  var mins=Math.max(15,Math.ceil((end-start)/60000/15)*15);
  var rend=new Date(start.getTime()+mins*60000);
  data.timeEntries.push({id:uid(),projectId:data.timer.projectId,kind:data.timer.kind,
    startISO:toLocalInput(start),endISO:toLocalInput(rend),notes:'',source:'timer'});
  data.timer=null;save();render();toast('Time entry saved ('+fmtHM(mins)+', rounded to 15 min)');}
</script>

<script>
/* ============ PROJECTS LIST ============ */
function renderProjects(){
  var h='<button class="btn" onclick="toggleProjForm()">+ New Project</button>';
  h+='<div id="projForm" style="display:none;margin-top:12px"><div class="card"><h3>New project</h3>'
    +'<label>Project name *</label><input id="np_name" placeholder="e.g. Lobby camera install">'
    +'<div class="row"><div><label>Customer</label><input id="np_customer"></div>'
    +'<div><label>Site</label><input id="np_site"></div></div>'
    +'<label>ConnectWise ticket #</label><input id="np_ticket" inputmode="numeric">'
    +'<label>Notes</label><textarea id="np_notes"></textarea>'
    +'<button class="btn grn" onclick="createProject()">Create project</button></div></div>';
  if(!data.projects.length){
    h+='<div class="card" style="margin-top:12px"><p class="mut">No projects yet. Create your first project to start tracking time, cable, materials and more.</p></div>';
  }
  h+='<button class="btn sec" style="margin:8px 0 12px" onclick="toggleImportForm()">Import Project</button>'
    +'<div id="importForm" style="display:none;margin-top:12px"><div class="card"><h3>Import project</h3>'
    +'<p class="mut">Bring in a project exported from another device (a fieldkit-*.json file).</p>'
    +'<input id="ip_file" type="file" accept=".json,.txt,application/json,text/plain">'
    +'<button class="btn sec" onclick="importProjectFile()">Import project</button>'
    +'<div id="ip_msg"></div></div></div>';
  data.projects.slice().sort(function(a,b){return ((a.status==='done')-(b.status==='done'))||((b.createdAt||0)-(a.createdAt||0));})
  .forEach(function(p){
    var mods=enabledMods(p);
    h+='<div class="card"><div class="proj-head"><div class="grow"><h3>'+esc(p.name)+'</h3>'
      +'<div class="mut">'+esc(p.customer||'')+(p.customer&&p.site?' · ':'')+esc(p.site||'')
      +(p.ticket?'<br>ConnectWise #'+esc(p.ticket):'')+'<br>Status: '+esc(p.status||'active')+'</div></div>'
      +'<button class="edt" onclick="delProject(\''+p.id+'\')">Delete</button></div>'
      +'<div style="margin:8px 0">'+mods.map(function(m){
          var lbl=MODULES.filter(function(x){return x[0]===m;})[0];
          return '<span class="chip on">'+esc(lbl?lbl[1]:m)+'</span>';}).join('')+'</div>'
      +'<div class="row"><div class="card" style="background:var(--panel2);margin:0;padding:10px;text-align:center">'
      +'<div class="mut">Time tracked</div><b>'+fmtHM(projectMinutes(p.id))+'</b></div>'
      +'<div class="card" style="background:var(--panel2);margin:0;padding:10px;text-align:center">'
      +'<div class="mut">Cable used</div><b>'+projectCableFt(p.id)+' ft</b></div></div>'
      +'<div class="row" style="margin-top:10px"><button class="btn" style="flex:1" onclick="openProject(\''+p.id+'\')">Open project</button>'
      +'<button class="btn sec" onclick="exportProject(\''+p.id+'\')">Export</button></div></div>';
  });
  $('app').innerHTML=h;
}
function toggleProjForm(){var f=$('projForm');f.style.display=f.style.display==='none'?'block':'none';}
function toggleImportForm(){var f=$('importForm');f.style.display=f.style.display==='none'?'block':'none';}
function createProject(){
  var name=val('np_name');if(!name){toast('Project name is required');return;}
  data.projects.push({id:uid(),createdAt:Date.now(),name:name,customer:val('np_customer'),site:val('np_site'),
    ticket:val('np_ticket'),notes:val('np_notes'),status:'active',technicians:[],
    enabledModules:DEFAULT_MODULES.slice()});
  save();render();toast('Project created');}
function delProject(id){
  if(!confirm('Delete this project and ALL its data (time, pulls, materials, etc.)?'))return;
  data.projects=data.projects.filter(function(p){return p.id!==id;});
  data.timeEntries=data.timeEntries.filter(function(e){return e.projectId!==id;});
  data.pulls=data.pulls.filter(function(x){return x.projectId!==id;});
  data.materials=data.materials.filter(function(x){return x.projectId!==id;});
  data.ipAssignments=data.ipAssignments.filter(function(x){return x.projectId!==id;});
  var sw=data.poeSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  data.poeDevices=data.poeDevices.filter(function(d){return sw.indexOf(d.switchId)<0;});
  data.poeSwitches=data.poeSwitches.filter(function(s){return s.projectId!==id;});
  var pw=data.portSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  data.portEntries=data.portEntries.filter(function(d){return pw.indexOf(d.switchId)<0;});
  data.portSwitches=data.portSwitches.filter(function(s){return s.projectId!==id;});
  delete data.storageCalcs[id];delete data.ipSubnets[id];
  if(data.timer&&data.timer.projectId===id)data.timer=null;
  save();goProjects();toast('Project deleted');}
function exportProject(id){
  var p=projById(id);if(!p)return;
  var swIds=data.poeSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  var ptIds=data.portSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  var pack={app:'datacom-field-kit',kind:'project-export',version:1,exportedAt:new Date().toISOString(),
    project:p,
    timeEntries:data.timeEntries.filter(function(e){return e.projectId===id;}),
    pulls:data.pulls.filter(function(x){return x.projectId===id;}),
    materials:data.materials.filter(function(m){return m.projectId===id;}),
    ipAssignments:data.ipAssignments.filter(function(x){return x.projectId===id;}),
    ipSubnets:data.ipSubnets?data.ipSubnets[id]:undefined,
    storageCalcs:data.storageCalcs?data.storageCalcs[id]:undefined,
    poeSwitches:data.poeSwitches.filter(function(s){return s.projectId===id;}),
    poeDevices:data.poeDevices.filter(function(d){return swIds.indexOf(d.switchId)>=0;}),
    portSwitches:data.portSwitches.filter(function(s){return s.projectId===id;}),
    portEntries:data.portEntries.filter(function(d){return ptIds.indexOf(d.switchId)>=0;})};
  var slug=String(p.name||'project').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'project';
  saveFile('fieldkit-'+slug+'.json',JSON.stringify(pack,null,2));}
function importProjectFile(){
  var fi=$('ip_file'),f=fi&&fi.files[0];
  if(!f){$('ip_msg').innerHTML='<div class="err">Choose a project file first.</div>';return;}
  var r=new FileReader();
  r.onload=function(){
    try{
      var pack=JSON.parse(r.result);
      if(!pack||pack.kind!=='project-export'||!pack.project||!pack.project.id)
        throw new Error('Not a Field Kit project export');
      var p=JSON.parse(JSON.stringify(pack.project));
      var copy=!!projById(p.id);
      var newPid=copy?uid():p.id;
      p.id=newPid;if(p.createdAt===undefined)p.createdAt=Date.now();
      data.projects.push(p);
      var swMap={};
      function pushUnique(arr,x){
        if(x.id&&arr.some(function(y){return y.id===x.id;}))return;
        arr.push(x);}
      function clone(x){return JSON.parse(JSON.stringify(x));}
      [['timeEntries','projectId'],['pulls','projectId'],['materials','projectId'],['ipAssignments','projectId']]
        .forEach(function(cfg){
          (pack[cfg[0]]||[]).forEach(function(x){var c=clone(x);c.projectId=newPid;
            if(copy)c.id=uid();pushUnique(data[cfg[0]],c);});});
      (pack.poeSwitches||[]).forEach(function(s){var c=clone(s);
        if(copy){c.id=uid();swMap[s.id]=c.id;}c.projectId=newPid;pushUnique(data.poeSwitches,c);});
      (pack.poeDevices||[]).forEach(function(d){var c=clone(d);
        if(copy){c.id=uid();if(swMap[d.switchId])c.switchId=swMap[d.switchId];}pushUnique(data.poeDevices,c);});
      (pack.portSwitches||[]).forEach(function(s){var c=clone(s);
        if(copy){c.id=uid();swMap[s.id]=c.id;}c.projectId=newPid;pushUnique(data.portSwitches,c);});
      (pack.portEntries||[]).forEach(function(d){var c=clone(d);
        if(copy){c.id=uid();if(swMap[d.switchId])c.switchId=swMap[d.switchId];}pushUnique(data.portEntries,c);});
      if(pack.ipSubnets!==undefined){if(!data.ipSubnets)data.ipSubnets={};data.ipSubnets[newPid]=pack.ipSubnets;}
      if(pack.storageCalcs!==undefined){if(!data.storageCalcs)data.storageCalcs={};data.storageCalcs[newPid]=pack.storageCalcs;}
      save();render();
      toast(copy?'Project imported as a copy':'Project imported');
    }catch(e){$('ip_msg').innerHTML='<div class="err">Import failed: '+esc(e.message)+'</div>';}
  };
  r.readAsText(f);}
/* ============ PROJECT VIEW SHELL ============ */

      return '<div class="switch"><span>'+esc(m[1])+(locked?' <span class="mut">(always on)</span>':'')+'</span><span class="tgl"><input type="checkbox"'
        +(on?' checked':'')+(locked?' disabled':'')+' onchange="toggleModule(\''+m[0]+'\',this.checked)"><i></i></span></div>';}).join('')
    +'<p class="mut">Turning a module off hides its tab here — its data is kept and comes back when you turn it on again.</p></div>';
  return h;
}
function techList(p){if(!p.technicians)p.technicians=[];return p.technicians;}
function techCardHTML(p){
  var techs=techList(p);
  var h='<div class="card"><h3>Technicians on this job</h3>';
  if(techs.length){
    h+=techs.map(function(t,i){
      return '<div class="kv"><span>'+esc(t)+'</span><button class="edt" onclick="delTech('+i+')">Remove</button></div>';}).join('');
  }else{
    h+='<p class="mut">No technicians listed yet.</p>';
  }
  h+='<div class="row" style="margin-top:8px"><input id="tech_name" placeholder="Tech name" style="flex:1">'
    +'<button class="btn grn" onclick="addTech()">Add</button></div></div>';

function addTech(){
  var p=projById(view.id);if(!p)return;
  var name=val('tech_name');if(!name){toast('Enter a name');return;}
  techList(p).push(name);save();render();toast('Technician added');}
function delTech(i){
  var p=projById(view.id);if(!p)return;
  var techs=techList(p);
  if(!confirm('Remove '+techs[i]+' from this job?'))return;
  techs.splice(i,1);save();render();}
function toggleModule(mod,on){
  var p=projById(view.id);if(!p)return;
  if(ALWAYS_ON.indexOf(mod)>=0)return;
  var mods=enabledMods(p).slice();
  if(on&&mods.indexOf(mod)<0)mods.push(mod);
  if(!on)mods=mods.filter(function(m){return m!==mod;});
  p.enabledModules=mods;save();
  if(!on&&curTab===mod)curTab='overview';
  render();}
function toggleProjStatus(){var p=projById(view.id);p.status=p.status==='done'?'active':'done';save();render();}
function editProjectForm(){

  p.ticket=val('ep_ticket');p.notes=val('ep_notes');save();render();toast('Project updated');}
/* ============ TIME TAB ============ */
var teEditId=null;
function timeHTML(p){
  var running=data.timer&&data.timer.projectId===p.id;
  var h='<div class="card"><h3>Timer</h3>';
  if(data.timer){
    h+='<p class="mut">A timer is running ('+esc(data.timer.kind)+' on '
      +esc((projById(data.timer.projectId)||{}).name||'another project')+'). Stop it from the bar at the top.</p>';
  }else{
    h+='<label>Kind</label><div class="seg" id="tkSeg">'
      +KINDS.map(function(k,i){return '<button type="button" data-k="'+k+'" class="'+(i===1?'act':'')+'" onclick="segPick(\'tkSeg\',this)">'+k+'</button>';}).join('')+'</div>'
      +'<button class="btn grn" onclick="startTimer(view.id,segVal(\'tkSeg\'))">Start timer</button>';
  }
  h+='</div>';
  h+='<div class="card"><h3>'+(teEditId?'Edit entry':'Add manual entry')+'</h3>'
    +'<label>Date</label><input id="te_date" type="date">'
    +'<div class="row"><div><label>Start</label><input id="te_start" type="time"></div>'
    +'<div><label>End</label><input id="te_end" type="time"></div></div>'
    +'<label>Kind</label><div class="seg" id="teSeg">'
    +KINDS.map(function(k,i){return '<button type="button" data-k="'+k+'" class="'+(i===1?'act':'')+'" onclick="segPick(\'teSeg\',this)">'+k+'</button>';}).join('')+'</div>'
    +'<label>Notes</label><textarea id="te_notes" rows="2" placeholder="What was done" oninput="autoGrow(this)"></textarea>'
    +'<button class="btn" onclick="saveTimeEntry()">'+(teEditId?'Save changes':'Add entry')+'</button>'
    +(teEditId?'<button class="btn sec" style="margin-top:8px" onclick="teEditId=null;render()">Cancel edit</button>':'')
    +'</div>';
  var entries=data.timeEntries.filter(function(e){return e.projectId===p.id;})
    .sort(function(a,b){return a.startISO<b.startISO?1:-1;});
  h+='<div class="card"><h3>Entries</h3>';
  if(!entries.length)h+='<p class="mut">No time entries yet.</p>';
  var byDay={};entries.forEach(function(e){var d=e.startISO.slice(0,10);(byDay[d]=byDay[d]||[]).push(e);});
  Object.keys(byDay).sort().reverse().forEach(function(d){
    var dayMin=0,kindMin={};
    byDay[d].forEach(function(e){var m=entryMinutes(e);dayMin+=m;kindMin[e.kind]=(kindMin[e.kind]||0)+m;});
    h+='<h4>'+esc(d)+' — '+fmtHM(dayMin)+'</h4><div class="mut" style="margin-bottom:6px">'
      +Object.keys(kindMin).map(function(k){return esc(k)+': '+fmtHM(kindMin[k]);}).join(' · ')+'</div>';
    byDay[d].forEach(function(e){
      h+='<div class="kv"><span>'+esc(e.startISO.slice(11,16))+'–'+esc(e.endISO.slice(11,16))
        +' · '+esc(e.kind)+(e.notes?'<br><span class="mut">'+esc(e.notes)+'</span>':'')+'</span>'
        +'<span style="white-space:nowrap"><b>'+fmtHM(entryMinutes(e))+'</b>'
        +'<button class="edt" onclick="editTimeEntry(\''+e.id+'\')">Edit</button>'
        +'<button class="del" onclick="delTimeEntry(\''+e.id+'\')">Del</button></span></div>';});
  });
  h+='</div>';
  return h;
}
function segPick(id,btn){var seg=$(id);Array.prototype.forEach.call(seg.children,function(c){c.className='';});
  btn.className='act';}
function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function segVal(id){var seg=$(id);for(var i=0;i<seg.children.length;i++)
  if(seg.children[i].className==='act')return seg.children[i].getAttribute('data-k');return KINDS[0];}
function saveTimeEntry(){
  var d=val('te_date'),s=val('te_start'),e=val('te_end');
  if(!d||!s||!e){toast('Date, start and end are required');return;}
  var start=d+'T'+s,end=d+'T'+e;
  if(new Date(end)<=new Date(start)){toast('End must be after start');return;}
  var kind=segVal('teSeg'),notes=val('te_notes');
  if(teEditId){var en=data.timeEntries.filter(function(x){return x.id===teEditId;})[0];
    if(en){en.startISO=start;en.endISO=end;en.kind=kind;en.notes=notes;}teEditId=null;}
  else data.timeEntries.push({id:uid(),projectId:view.id,kind:kind,startISO:start,endISO:end,
    notes:notes,source:'manual'});
  save();render();toast('Entry saved');}
function editTimeEntry(id){var e=data.timeEntries.filter(function(x){return x.id===id;})[0];if(!e)return;
  teEditId=id;render();
  $('te_date').value=e.startISO.slice(0,10);$('te_start').value=e.startISO.slice(11,16);
  $('te_end').value=e.endISO.slice(11,16);$('te_notes').value=e.notes||'';autoGrow($('te_notes'));
  var seg=$('teSeg');Array.prototype.forEach.call(seg.children,function(c){
    c.className=c.getAttribute('data-k')===e.kind?'act':'';});
  window.scrollTo(0,0);}
function delTimeEntry(id){if(!confirm('Delete this time entry?'))return;
  data.timeEntries=data.timeEntries.filter(function(e){return e.id!==id;});save();render();}
</script>

<script>
/* ============ CABLE TAB ============ */
var pullMode='range';
function cableHTML(p){
  var boxes={};
  data.pulls.filter(function(x){return x.projectId===p.id;}).forEach(function(x){
    var key=x.box||'Box 1';
    if(!boxes[key])boxes[key]={size:Number(x.boxSize)||1000,used:0,rows:[]};

  var boxNames=Object.keys(boxes);

    +'<div class="row"><div><label>Cable type</label><input id="cp_run" placeholder="e.g. Cat6"></div>'

    +'<label>Box size (ft)</label><input id="cp_size" type="number" inputmode="decimal" value="1000">'
    +'<label>Markings on the box</label><div class="seg">'

    +'<div><label>Newest number (ft)</label><input id="cp_new" type="number" inputmode="decimal"></div></div>'
    +'<p class="mut">Used = previous − newest.</p></div>'
    +'<div id="pm_single_fields" style="display:'+(pullMode==='single'?'block':'none')+'">'
    +'<label>Marking (ft remaining on box)</label><input id="cp_mark" type="number" inputmode="decimal">'
    +'<p class="mut">Used = box size − marking.</p></div>'
    +'<div id="cp_err"></div>'
    +'<button class="btn" onclick="addPull()">Add pull</button></div>';
  h+='<div class="card"><h3>Pulls on this job</h3>';

  boxNames.forEach(function(b){
    var bx=boxes[b];
    h+='<h4>'+esc(b)+' — '+bx.used+' ft used · '+Math.max(0,bx.size-bx.used)+' ft left of '+bx.size+'</h4>';
    h+='<table><tr><th>Cable type</th><th>Markings</th><th>Used</th><th></th></tr>';
    bx.rows.forEach(function(x){
      var mk=x.mode==='single'?('single '+x.marking):(x.prev+' → '+x.newest);
      h+='<tr><td>'+esc(x.run||'')+'</td><td>'+esc(mk)+'</td><td><b>'+x.used+' ft</b></td>'
        +'<td><button class="del" onclick="delPull(\''+x.id+'\')">Del</button></td></tr>';});
    h+='</table>';});
  h+='<div class="kv" style="margin-top:8px"><span class="mut">Project total</span><b>'+projectCableFt(p.id)+' ft</b></div></div>';
  return h;
}
function setPullMode(m){pullMode=m;
  $('pm_range').className=m==='range'?'act':'';$('pm_single').className=m==='single'?'act':'';
  $('pm_range_fields').style.display=m==='range'?'block':'none';
  $('pm_single_fields').style.display=m==='single'?'block':'none';}
function addPull(){
  var size=num('cp_size')||1000,err='';
  var used,prev=null,newest=null,marking=null;
  if(pullMode==='range'){
    prev=parseFloat(val('cp_prev'));newest=parseFloat(val('cp_new'));
    if(!isFinite(prev)||!isFinite(newest))err='Enter both the previous and newest markings.';
    else if(prev<0||prev>size||newest<0||newest>size)err='Markings must be between 0 and the box size ('+size+' ft).';
    else{used=FK.cableUsed(prev,newest,size);if(used<=0)err='Used footage must be more than 0 — check the markings.';}
  }else{
    marking=parseFloat(val('cp_mark'));
    if(!isFinite(marking))err='Enter the single marking.';
    else if(marking<0||marking>size)err='Marking must be between 0 and the box size ('+size+' ft).';
    else{used=FK.cableUsed(marking,null,size);if(used<=0)err='Used footage must be more than 0 — check the marking.';}
  }
  if(err){$('cp_err').innerHTML='<div class="err">'+esc(err)+'</div>';return;}
  data.pulls.push({id:uid(),projectId:view.id,run:val('cp_run'),box:val('cp_box')||'Box 1',
    boxSize:size,mode:pullMode,prev:prev,newest:newest,marking:marking,used:used,date:todayStr()});
  save();render();toast('Pull added — '+used+' ft');}
function delPull(id){if(!confirm('Delete this pull?'))return;
  data.pulls=data.pulls.filter(function(x){return x.id!==id;});save();render();}
/* ============ STORAGE TAB ============ */
var ST_PRESETS=[['1080p',4],['4MP',8],['5MP',10],['4K',16]];
function storageHTML(p){

    +'<div id="st_out"></div>'

function storageRecalc(p){

var POE_PRESETS=[['Fixed camera',15],['PTZ',30],['Hi-PoE PTZ',60],['Wi-Fi AP',25],['Phone',7]];
function poeHTML(p){
  var sws=data.poeSwitches.filter(function(s){return s.projectId===p.id;});
  var h='<div class="card"><h3>Add switch</h3>'
    +'<div class="row"><div><label>Switch name</label><input id="poe_swname" placeholder="e.g. MDF switch"></div>'
    +'<div><label>PoE budget (W)</label><input id="poe_budget" type="number" inputmode="decimal" placeholder="720"></div></div>'
    +'<div class="seg"><button type="button" onclick="$(\'poe_budget\').value=720;$(\'poe_swname\').value=$(\'poe_swname\').value||\'USW-Pro-Max-48-PoE\'">Preset: USW-Pro-Max-48-PoE · 720W</button></div>'
    +'<button class="btn" onclick="addPoeSwitch()">Add switch</button></div>';
  if(!sws.length)h+='<div class="card"><p class="mut">No switches yet.</p></div>';
  sws.forEach(function(sw){
    var devs=data.poeDevices.filter(function(d){return d.switchId===sw.id;});
    var total=devs.reduce(function(s,d){return s+(Number(d.watts)||0)*(Number(d.qty)||0);},0);
    var pct=sw.budget>0?Math.min(100,total/sw.budget*100):0;
    var cls=total>sw.budget?'over':(sw.budget>0&&total/sw.budget>0.8?'warn':'');
    h+='<div class="card"><div class="proj-head"><div class="grow"><h3>'+esc(sw.name)+'</h3>'
      +'<div class="mut">Budget '+sw.budget+' W</div></div>'
      +'<button class="del" onclick="delPoeSwitch(\''+sw.id+'\')">Delete</button></div>'
      +'<div class="big">'+total.toFixed(1)+' W <span class="mut" style="font-size:.9rem">of '+sw.budget+' W ('+(sw.budget>0?(total/sw.budget*100).toFixed(0):'—')+'%)</span></div>'
      +'<div class="bar"><i class="'+cls+'" style="width:'+pct+'%"></i></div>'
      +(total>sw.budget?'<div class="err">Over budget by '+(total-sw.budget).toFixed(1)+' W.</div>'
        :(cls==='warn'?'<div class="err" style="background:#3a2f07;border-color:var(--amber);color:#ffe1a8">Over 80% of budget — check headroom.</div>':''))
      +'<table><tr><th>Device</th><th>W ea</th><th>Qty</th><th>Total</th><th></th></tr>'
      +devs.map(function(d){return '<tr><td>'+esc(d.name)+'</td><td>'+d.watts+'</td><td>'+d.qty+'</td><td><b>'
        +((Number(d.watts)||0)*(Number(d.qty)||0)).toFixed(1)+'</b></td>'
        +'<td><button class="del" onclick="delPoeDevice(\''+d.id+'\')">Del</button></td></tr>';}).join('')+'</table>'
      +'<h4>Add device</h4><div class="seg">'
      +POE_PRESETS.map(function(pr){return '<button type="button" class="preset" onclick="poeFill(\''+sw.id+'\',\''+pr[0]+'\','+pr[1]+')">'+pr[0]+' '+pr[1]+'W</button>';}).join('')
      +'<button type="button" class="preset" onclick="poeFill(\''+sw.id+'\',\'Custom\',\'\')">Custom</button></div>'
      +'<div class="row"><div><label>Name</label><input id="pd_name_'+sw.id+'"></div>'
      +'<div><label>Watts ea</label><input id="pd_w_'+sw.id+'" type="number" inputmode="decimal"></div>'
      +'<div><label>Qty</label><input id="pd_q_'+sw.id+'" type="number" inputmode="numeric" value="1"></div></div>'
      +'<button class="btn sec" onclick="addPoeDevice(\''+sw.id+'\')">Add device</button></div>';
  });
  return h;
}
function poeFill(swId,name,w){$('pd_name_'+swId).value=name;
  if(w!=='')$('pd_w_'+swId).value=w;$('pd_q_'+swId).focus();}
function addPoeSwitch(){var name=val('poe_swname'),budget=num('poe_budget');
  if(!name){toast('Switch name required');return;}
  if(!(budget>0)){toast('Enter a PoE budget in watts');return;}
  data.poeSwitches.push({id:uid(),projectId:view.id,name:name,budget:budget});

function delPoeSwitch(id){if(!confirm('Delete this switch and its devices?'))return;
  data.poeSwitches=data.poeSwitches.filter(function(s){return s.id!==id;});
  data.poeDevices=data.poeDevices.filter(function(d){return d.switchId!==id;});save();render();}
function addPoeDevice(swId){var name=val('pd_name_'+swId),w=parseFloat(val('pd_w_'+swId)),q=parseFloat(val('pd_q_'+swId));
  if(!name){toast('Device name required');return;}

  if(!isFinite(q)||q<=0)q=1;
  data.poeDevices.push({id:uid(),switchId:swId,name:name,watts:w,qty:q});save();render();}
function delPoeDevice(id){data.poeDevices=data.poeDevices.filter(function(d){return d.id!==id;});save();render();}

      .forEach(function(x){used[x.ip]=true;});

    +'<button class="btn sec" onclick="saveFile(\'connectwise-notes.txt\',val(\'cw_notes\'))">Save .txt</button></div></div>';

function connectwiseNotes(p){
  var L=[];
  L.push('CONNECTWISE NOTES');
  L.push(p.name+(p.ticket?'  |  ConnectWise #'+p.ticket:''));
  if(p.customer)L.push('Customer: '+p.customer+(p.site?'  |  Site: '+p.site:''));
  L.push('Prepared: '+todayStr());
  L.push('');
  L.push('TIME');
  L.push('----------------------------------------');
  var entries=data.timeEntries.filter(function(e){return e.projectId===p.id;})
    .sort(function(a,b){return a.startISO<b.startISO?-1:1;});
  if(!entries.length){L.push('No time entries.');}
  else{
    var byDay={},grand=0;
    entries.forEach(function(e){var d=e.startISO.slice(0,10);(byDay[d]=byDay[d]||[]).push(e);});
    Object.keys(byDay).sort().forEach(function(d){
      var kindMin={},dayMin=0;
      byDay[d].forEach(function(e){var m=entryMinutes(e);dayMin+=m;kindMin[e.kind]=(kindMin[e.kind]||0)+m;});
      grand+=dayMin;
      L.push(d+'  |  '+fmtH(dayMin));
      KINDS.forEach(function(k){if(kindMin[k])L.push('  '+k+': '+fmtH(kindMin[k]));});
      byDay[d].forEach(function(e){
        L.push('  '+e.startISO.slice(11,16)+'-'+e.endISO.slice(11,16)+'  '+e.kind+(e.notes?'  —  '+e.notes:''));});
      L.push('');
    });
    L.push('Total time: '+fmtH(grand));
  }
  L.push('');
  L.push('CABLE');
  L.push('----------------------------------------');
  var byType={};
  data.pulls.filter(function(x){return x.projectId===p.id;}).forEach(function(x){
    var t=x.run||'Unspecified';byType[t]=(byType[t]||0)+(Number(x.used)||0);});
  var types=Object.keys(byType);
  if(!types.length)L.push('No cable pulls logged.');
  else types.forEach(function(t){L.push(t+': '+byType[t]+' ft');});
  L.push('');
  L.push('MATERIALS');
  L.push('----------------------------------------');
  var mats=data.materials.filter(function(m){return m.projectId===p.id;});
  if(!mats.length)L.push('No materials logged.');
  else mats.forEach(function(m){
    L.push(m.qty+' x '+m.name+' ('+m.unit+')'+(m.notes?'  —  '+m.notes:''));});
  return L.join('\n').replace(/\n{3,}/g,'\n\n').replace(/\s+$/,'');
}

function delMatPick(i){if(!confirm('Remove this quick pick?'))return;

function learnMatPick(name,unit){

function editMaterial(id){var m=data.materials.filter(function(x){return x.id===id;})[0];if(!m)return;

function renderBackup(){
  $('app').innerHTML='<div class="card"><h3>Export backup</h3>'
    +'<p class="mut">All Field Kit data as JSON. Save it somewhere safe — it is the only copy of your on-device data.</p>'
    +'<button class="btn" onclick="saveFile(\'datacom-field-kit-backup.json\',JSON.stringify(data))">Backup</button></div>'
    +'<div class="card"><h3>Import backup</h3>'
    +'<p class="mut">Restoring replaces ALL current data in the app.</p>'
    +'<input id="bk_file" type="file" accept=".json,.txt,application/json,text/plain">'
    +'<button class="btn red" onclick="importBackup()">Import and replace all data</button>'
    +'<div id="bk_msg"></div></div>';
}
function importBackup(){
  var f=$('bk_file').files[0];
  if(!f){$('bk_msg').innerHTML='<div class="err">Choose a backup JSON file first.</div>';return;}
  var r=new FileReader();
  r.onload=function(){
    try{var parsed=JSON.parse(r.result);
      if(!parsed||!Array.isArray(parsed.projects))throw new Error('Not a Field Kit backup');
      var d=defaultData();for(var k in d){data[k]=parsed[k]!==undefined?parsed[k]:d[k];}
      save();goProjects();toast('Backup imported');
    }catch(e){$('bk_msg').innerHTML='<div class="err">Import failed: '+esc(e.message)+'</div>';}
  };
  r.readAsText(f);}
/* ============ init ============ */
(function(){var f=document.getElementById('appfoot');if(f)f.innerHTML+=' &middot; v'+APP_VERSION;})();
render();
</script>
</body>
</html>
